name: Matchday forecasts
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Ingest+publish matchday tips, or settle results only
        type: choice
        options: [daily, settle]
        default: daily
  schedule:
    - cron: '0 3,12 * * *' # 06:00 and 15:00 Ethiopian time
    - cron: '*/30 13-22 * * *' # Result refresh during European match hours
permissions:
  contents: read
concurrency:
  group: matchday-pipeline
  cancel-in-progress: false
jobs:
  forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THE_ODDS_API_MONTHLY_CREDITS: "500"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check server configuration
        run: |
          node <<'NODE'
          const required = ['NEXT_PUBLIC_SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY', 'FOOTBALL_DATA_ORG_TOKEN'];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) {
            console.error(`Missing GitHub Actions secrets: ${missing.join(', ')}`);
            console.error('Add them under Settings > Secrets and variables > Actions.');
            process.exit(1);
          }
          if (!process.env.NEXT_PUBLIC_SUPABASE_URL.startsWith('https://')) {
            console.error('NEXT_PUBLIC_SUPABASE_URL must be the https Supabase project URL.');
            process.exit(1);
          }
          const serviceKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (serviceKey.startsWith('sb_secret_')) {
            console.log('Using Supabase secret-key format.');
          } else {
            try {
              const payload = JSON.parse(Buffer.from(serviceKey.split('.')[1], 'base64url').toString('utf8'));
              if (payload.role !== 'service_role') {
                console.error('SUPABASE_SERVICE_ROLE_KEY is the public anon key. Copy the service_role key instead.');
                process.exit(1);
              }
            } catch {
              console.error('SUPABASE_SERVICE_ROLE_KEY must be the service_role JWT or an sb_secret_ key from Supabase Project Settings > API.');
              process.exit(1);
            }
          }
          console.log('Supabase and football-data.org workflow configuration is present.');
          NODE
      - name: Restore completed results cache
        if: github.event.schedule == '0 3,12 * * *' || inputs.operation == 'daily'
        uses: actions/cache/restore@v5
        with:
          path: |
            .data/openfootball
            .data/recent-results
          key: matchday-ingest-${{ github.run_id }}
          restore-keys: matchday-ingest-
      - name: Ingest
        if: github.event.schedule == '0 3,12 * * *' || inputs.operation == 'daily'
        # Secrets come from job env; do not use --env-file=.env.local (absent on runners).
        run: npx --no-install tsx scripts/ingest-matchday.ts
      - name: Publish
        if: github.event.schedule == '0 3,12 * * *' || inputs.operation == 'daily'
        # 7-day window covers midweek cups and the next weekend during international breaks.
        run: npx --no-install tsx scripts/run-live-profiles.ts --days 7
      - name: Cache ingest artifacts
        if: success() && (github.event.schedule == '0 3,12 * * *' || inputs.operation == 'daily')
        uses: actions/cache/save@v5
        with:
          path: |
            .data/openfootball
            .data/recent-results
          key: matchday-ingest-${{ github.run_id }}
      - name: Settle
        if: github.event.schedule == '*/30 13-22 * * *' || inputs.operation == 'settle'
        run: npx --no-install tsx scripts/run-live-profiles.ts --settle-only
